<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tessera AI Indexer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* iOS-like neutral, very slight warm cast */
    --bg:        oklch(98.6% 0.003 100);
    --bg-2:      oklch(96.4% 0.004 100);
    --surface:   oklch(100% 0 0);
    --surface-2: oklch(98.2% 0.003 100);
    --hairline:  oklch(89% 0.004 100);
    --hairline-2:oklch(93% 0.003 100);
    --text:      oklch(22% 0.01 260);
    --text-2:    oklch(45% 0.008 260);
    --text-3:    oklch(62% 0.007 260);

    --accent:    oklch(62% 0.17 250);          /* iOS blue */
    --accent-bg: oklch(95% 0.04 250);
    --green:     oklch(68% 0.17 145);
    --amber:     oklch(74% 0.13 75);
    --red:       oklch(64% 0.19 27);
    --violet:    oklch(63% 0.16 295);

    --shadow-sm: 0 1px 0 rgba(15,17,21,0.04), 0 1px 2px rgba(15,17,21,0.04);
    --shadow-md: 0 1px 0 rgba(15,17,21,0.04), 0 8px 24px -10px rgba(15,17,21,0.12);
    --radius:    12px;
    --radius-sm: 8px;
    --radius-lg: 16px;
  }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter Tight", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    font-feature-settings: "ss01", "cv11";
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  *, *::before, *::after { box-sizing: border-box; }
  button { font-family: inherit; }
  ::selection { background: var(--accent-bg); color: var(--text); }
  .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace; font-feature-settings: "zero"; }

  /* Subtle scrollbars */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: oklch(85% 0.005 100); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: oklch(78% 0.005 100); background-clip: padding-box; border: 2px solid transparent; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="panels.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
