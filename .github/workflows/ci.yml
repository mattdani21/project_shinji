name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (editable, dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest tests/ -q
        # NOTE: test_scenario_d_legacy_form skips when models/tier4_model.joblib
        # is absent (model binaries are gitignored). The rest of the suite runs.

      - name: Build wheel (packaging stays healthy)
        run: python -m build --wheel

  demo-smoke:
    name: demo smoke (fresh-clone mini demo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (editable, dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the canonical mini demo (asserts exit 0)
        run: PYTHONPATH=. python demo/mini_demo.py

      - name: Assert demo artifacts auto-cleaned
        run: test ! -d demo/run && echo "demo/run cleaned OK"
